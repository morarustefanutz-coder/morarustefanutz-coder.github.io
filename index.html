<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stefan Moraru - Developer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f1a; color: white; }
        header { background: #1a1a2e; padding: 40px; text-align: center; }
        header h1 { font-size: 2.5em; color: #00d4ff; }
        header p { color: #aaa; margin-top: 10px; }
        .apps { display: flex; justify-content: center; gap: 30px; padding: 50px; flex-wrap: wrap; }
        .app-card { background: #1a1a2e; border-radius: 15px; padding: 30px; width: 250px; text-align: center; }
        .app-card h3 { color: #00d4ff; margin-bottom: 10px; }
        .app-card p { color: #aaa; font-size: 0.9em; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #00d4ff; color: #000; border-radius: 8px; text-decoration: none; font-weight: bold; }
        footer { text-align: center; padding: 20px; color: #aaa; }
    </style>
</head>
<body>
    <header>
        <h1>Stefan Moraru</h1>
        <p>Android Game Developer</p>
    </header>
    <div class="apps">
        <div class="app-card">
            <h3>🎮 Morphic</h3>
            <p>Joc de actiune si strategie pentru Android</p>
            <a class="btn" href="https://play.google.com/store/apps/details?id=com.stefan.morphic">Play Store</a>
        </div>
        <div class="app-card">
            <h3>⚔️ Stick Warriors</h3>
            <p>Lupta cu armate de stickmen pe Android</p>
            <a class="btn" href="https://play.google.com/store/apps/details?id=com.stickwarriors.game">Play Store</a>
        </div>
    </div>
    <footer>
        <p>© 2026 Stefan Moraru | contact: morarustefanutz@gmail.com</p>
    </footer>
</body>
</html>
